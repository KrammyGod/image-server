apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-static
  labels:
    app: nginx-static
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-static
  template:
    metadata:
      labels:
        app: nginx-static
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: http-lan
              containerPort: 8090
              protocol: TCP
          env:
            # Restricts the entrypoint's envsubst pass to ${CDN_*}. Without it
            # every nginx variable in the template is replaced with an empty
            # string and the config becomes nonsense.
            - name: NGINX_ENVSUBST_FILTER
              value: "^CDN_"
            # The template is a whole nginx.conf, not a conf.d fragment, so it
            # has to render over the image's own default.
            - name: NGINX_ENVSUBST_OUTPUT_DIR
              value: /etc/nginx
          envFrom:
            - secretRef:
                name: nginx-static-secret
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: images
              mountPath: /srv/data/images
              readOnly: true
            - name: config
              mountPath: /etc/nginx/templates/nginx.conf.template
              subPath: nginx.conf
            - name: config
              mountPath: /etc/nginx/well-known/discord.txt
              subPath: discord.txt
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
      nodeSelector:
        kubernetes.io/hostname: oopi
      volumes:
        - name: images
          hostPath:
            path: /data/images
            type: Directory
        - name: config
          configMap:
            name: nginx-static-config
