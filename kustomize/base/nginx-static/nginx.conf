user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # To the pod's stdout/stderr so `kubectl logs` works.
    access_log /dev/stdout combined;
    error_log /dev/stderr;
    gzip on;

    map $http_from_cloudfront $cdn_ok {
        default 0;
        "${CDN_ORIGIN_HEADER_VALUE}" 1;
    }

    server {
        listen 8080;
        listen [::]:8080;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location = /.well-known/discord {
            default_type text/plain;
            alias /etc/nginx/well-known/discord.txt;
        }

        # I wonder what this is?
        location = /data {
            if ($cdn_ok = 0) {
                return 444;
            }
            return 302 https://www.youtube.com/watch?v=dQw4w9WgXcQ;
        }

        # I wonder what this is?
        location = /data/ {
            if ($cdn_ok = 0) {
                return 444;
            }
            return 302 https://www.youtube.com/watch?v=dQw4w9WgXcQ;
        }

        location /data/images/ {
            if ($cdn_ok = 0) {
                return 444;
            }

            root /srv;

            open_file_cache max=200000 inactive=20s;
            open_file_cache_valid 30s;
            open_file_cache_min_uses 2;
            open_file_cache_errors on;

            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";

            sendfile_max_chunk 1m;

            etag off;
            if_modified_since off;

            add_header X-Content-Type-Options nosniff;
        }

        location /data/source/ {
            if ($cdn_ok = 0) {
                return 444;
            }

            # A literal upstream, so nginx resolves it once at startup.
            proxy_pass http://image-server-service.image-server.svc.cluster.local:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Second listener for the LAN-restricted ingress entrypoint.
    server {
        listen 8090;
        listen [::]:8090;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /data/images/ {
            root /srv;

            open_file_cache max=200000 inactive=20s;
            open_file_cache_valid 30s;
            open_file_cache_min_uses 2;
            open_file_cache_errors on;

            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";

            sendfile_max_chunk 1m;

            etag off;
            if_modified_since off;

            add_header X-Content-Type-Options nosniff;
        }
    }
}
