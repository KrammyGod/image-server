apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-server
  labels:
    app: image-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-server
  template:
    metadata:
      labels:
        app: image-server
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
      containers:
        - name: image-server
          image: ghcr.io/krammygod/image-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: rest
              containerPort: 5000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: images
              mountPath: /data/images
          readinessProbe:
            httpGet:
              path: /healthz
              port: rest
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: rest
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
      nodeSelector:
        kubernetes.io/hostname: oopi
      volumes:
        - name: images
          hostPath:
            path: /data/images
            # Directory, not DirectoryOrCreate: if the disk is not mounted we
            # want a pod that refuses to start.
            type: Directory
